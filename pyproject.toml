[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "android-root-intelligence"
version = "0.4.0"
description = "Agente ARI para Codex; investigación de compatibilidad y ADB de lectura en Fase 4"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "anyio>=4.10,<5",
    "pydantic>=2.14.2,<3",
    "SQLAlchemy>=2.1.6,<2.2",
    "mcp>=2.3.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9.2,<10", "ruff>=0.17.3,<0.18", "build>=1.6.1,<2", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ari*", "integrations*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
markers = ["stdio: launches only the local ARI MCP Python server, never device tools"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
